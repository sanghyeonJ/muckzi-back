spring.application.name=muckzi-back

# 배포 환경(Render 등)이 정해주는 포트 사용 (없으면 8080)
server.port=${PORT:8080}

# =========================================================
# 1. PostgreSQL (Supabase) 접속 - 값은 환경변수로
# =========================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase 무료 플랜 동시 접속 수 제한 대비 (로컬 + 배포 서버 동시 접속)
spring.datasource.hikari.maximum-pool-size=5

# =========================================================
# 2. JPA / Hibernate
# =========================================================
# 엔티티 기준으로 테이블 자동 생성·수정 (안정화되면 validate로 변경 가능)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# 실행되는 SQL을 콘솔에 출력 (배포 환경에서는 false 권장)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# 3. Swagger (Springdoc)
# =========================================================
# API 문서를 만들 패키지
springdoc.packages-to-scan=com.muckzi
# Swagger UI 접속 주소 (/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# 4. JWT
# =========================================================
jwt.secret=${JWT_SECRET}
# 액세스 토큰 1시간
jwt.expiration=3600000
# 리프레시 토큰 14일
jwt.refresh-expiration=1209600000

# =========================================================
# 5. 카카오 장소 검색
# =========================================================
kakao.rest-api-key=${KAKAO_REST_API_KEY}

# =========================================================
# 6. 파일 업로드 크기 제한
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# =========================================================
# 7. CORS 허용 주소 (여러 개는 쉼표로 구분)
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# 8. Supabase Storage (게시글 이미지 저장소)
# =========================================================
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET:post-images}